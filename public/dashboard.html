<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvoiceFlow | Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="dashboard">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">IF</div>
          <div>
            <span class="eyebrow light">Business</span>
            <h1>InvoiceFlow</h1>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a class="nav-link active" href="/dashboard">Dashboard</a>
          <a class="nav-link" href="/profile">Profile</a>
          <a class="nav-link" href="/products">Produk</a>
          <a class="nav-link" href="/customers">Customer</a>
          <a class="nav-link" href="/invoices">Invoice</a>
          <a class="nav-link logout-link" href="/">Logout</a>
        </nav>
      </aside>

      <main class="content-area">
        <header class="page-header">
          <div>
            <span class="eyebrow dark">Overview</span>
            <h2>Dashboard</h2>
          </div>
          <a class="btn btn-primary" href="/invoices">+ Buat Invoice</a>
        </header>

        <section class="stats-grid">
          <article class="info-card blue">
            <div>
              <span>Total Revenue</span>
              <strong id="totalRevenue">Rp 0</strong>
            </div>
            <small>Bulanan</small>
          </article>
          <article class="info-card purple">
            <div>
              <span>Invoice</span>
              <strong id="totalInvoices">0</strong>
            </div>
            <small>Semua</small>
          </article>
          <article class="info-card green">
            <div>
              <span>Paid</span>
              <strong id="paidInvoices">0</strong>
            </div>
            <small>Lunas</small>
          </article>
          <article class="info-card orange">
            <div>
              <span>Customer</span>
              <strong id="totalCustomers">0</strong>
            </div>
            <small>Aktif</small>
          </article>
        </section>

        <section class="card-grid">
          <article class="panel">
            <div class="panel-header">
              <h3>Profil Usaha</h3>
              <a class="text-link" href="/profile">Edit</a>
            </div>
            <div id="companySummary" class="summary-box"></div>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h3>Shortcut</h3>
            </div>
            <div class="quick-actions">
              <a class="btn btn-light" href="/products">Kelola Produk</a>
              <a class="btn btn-light" href="/customers">Kelola Customer</a>
              <a class="btn btn-light" href="/invoices">Kelola Invoice</a>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
