<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvoiceFlow | Customer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="customers">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">IF</div>
          <div>
            <span class="eyebrow light">Business</span>
            <h1>InvoiceFlow</h1>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-link" href="/dashboard">Dashboard</a>
          <a class="nav-link" href="/profile">Profile</a>
          <a class="nav-link" href="/products">Produk</a>
          <a class="nav-link active" href="/customers">Customer</a>
          <a class="nav-link" href="/invoices">Invoice</a>
          <a class="nav-link logout-link" href="/">Logout</a>
        </nav>
      </aside>

      <main class="content-area">
        <header class="page-header">
          <div>
            <span class="eyebrow dark">Master Data</span>
            <h2>Customer</h2>
          </div>
        </header>

        <section class="two-panel-grid">
          <article class="panel form-panel-box">
            <h3>Tambah Customer</h3>
            <form id="customerForm" class="stacked-form">
              <label>
                Nama Customer
                <input type="text" name="name" placeholder="Contoh: Rina Amelia" required />
              </label>
              <div class="form-grid two-col">
                <label>
                  Perusahaan
                  <input type="text" name="company" placeholder="Nama perusahaan" />
                </label>
                <label>
                  Email
                  <input type="email" name="email" placeholder="email@customer.id" />
                </label>
                <label>
                  Telepon
                  <input type="text" name="phone" placeholder="0812..." />
                </label>
                <label>
                  NPWP (opsional)
                  <input type="text" name="npwp" placeholder="Nomor NPWP customer" />
                </label>
                <label class="full-span">
                  Alamat
                  <input type="text" name="address" placeholder="Alamat lengkap" />
                </label>
              </div>
              <button type="submit" class="btn btn-primary">Simpan Customer</button>
            </form>
          </article>

          <article class="panel list-panel-box">
            <div class="panel-header">
              <h3>Daftar Customer</h3>
            </div>
            <div class="list-table-wrap">
              <table class="data-table" id="customersTable">
                <thead>
                  <tr><th>Nama</th><th>Perusahaan</th><th>Phone</th><th>NPWP</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
